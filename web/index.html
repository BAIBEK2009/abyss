<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABYSS · Карта капитана</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23B8893B%22/%3E%3Cpath d=%22M4 9h8l-1.5 2h-5z%22 fill=%22%23F2B632%22/%3E%3C/svg%3E">
  <!-- three.js is vendored in web/vendor/three: the game works offline -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <!-- All text lives here, as HTML over the canvas: always crisp, Cyrillic just works.
       Tags pinned to 3D objects are added by js/ui.js. -->
  <div id="overlay"></div>
  <div class="status" id="status" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
